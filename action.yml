---
name: Setup mago
description: Install the mago PHP toolchain without spending GitHub REST API calls.

inputs:
  version:
    description: >-
      Version of mago to install, without a leading "v" (e.g. "1.29.0"), or "latest".
    required: false
    default: latest
  sha256:
    description: >-
      Expected sha256 of the release archive, verified before the binary is installed.
      Checked only when set, since the value differs per version and per platform.
    required: false
    default: ""

outputs:
  version:
    description: The version that was installed, with "latest" resolved to a concrete one.
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        # mago publishes one asset per Rust target triple, so map the runner onto one.
        case "$ARCH" in
          X64) arch=x86_64 ;;
          ARM64) arch=aarch64 ;;
          *) echo "::error::setup-mago does not support the $ARCH architecture"; exit 1 ;;
        esac
        case "$OS" in
          Linux) triple="$arch-unknown-linux-musl" ;;
          macOS) triple="$arch-apple-darwin" ;;
          *) echo "::error::setup-mago does not support $OS; only Linux and macOS are handled"; exit 1 ;;
        esac

        # "latest" comes from where the releases page redirects to, which names the tag. Asking the
        # REST API instead would spend exactly the quota this action exists to protect -- and more
        # of it than a pinned version does, since resolving latest there means listing releases.
        if [ "$VERSION" = latest ]; then
          effective=$(curl -fsSLo /dev/null -w '%{url_effective}' \
            https://github.com/carthage-software/mago/releases/latest)
          VERSION="${effective##*/}"
          if [ -z "$VERSION" ] || [ "$VERSION" = latest ]; then
            echo "::error::could not resolve the latest mago release; the redirect gave $effective"
            exit 1
          fi
          echo "latest is $VERSION"
        fi

        # Each pin gets its own directory, so two installs in one job never share a path. Sharing
        # one would let actions/cache save whatever an earlier install left there under this
        # install's key, and a later run restoring that key would skip the download -- and with it
        # the checksum -- for a binary this pin never verified.
        echo "triple=$triple" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "dir=$HOME/.cache/setup-mago/$triple/$VERSION/${SHA256:-unpinned}" >> "$GITHUB_OUTPUT"

    # The checksum is part of the key: changing it should re-download and re-verify rather than
    # hand back the binary an earlier, differently-pinned run cached.
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.dir }}
        # The leading 2 is the layout, not the tool: entries written under the old shared path are
        # not restorable into this one and must not be reachable by key.
        key: mago-2-${{ steps.resolve.outputs.triple }}-${{ steps.resolve.outputs.version }}-${{ inputs.sha256 }}

    # The release asset is served by the CDN rather than the REST API, so this costs no quota. It
    # lands in a temporary directory, and the install directory is not created until the archive
    # verifies, so a failed check leaves nothing behind for actions/cache to save under this key.
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        SHA256: ${{ inputs.sha256 }}
        TRIPLE: ${{ steps.resolve.outputs.triple }}
        DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        name="mago-${VERSION}-${TRIPLE}"
        url="https://github.com/carthage-software/mago/releases/download/${VERSION}/${name}.tar.gz"
        tmp=$(mktemp -d)
        curl -fsSL -o "$tmp/mago.tar.gz" "$url"
        if [ -n "$SHA256" ]; then
          # macOS runners ship shasum, not GNU sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${SHA256}  $tmp/mago.tar.gz" | sha256sum -c -
          else
            echo "${SHA256}  $tmp/mago.tar.gz" | shasum -a 256 -c -
          fi
        fi
        tar -xzf "$tmp/mago.tar.gz" -C "$tmp"
        mkdir -p "$DIR"
        mv "$tmp/$name/mago" "$DIR/mago"

    # A restored cache entry must still contain the binary; anything else is a broken entry and
    # should say so rather than leave a later step failing on "mago: command not found".
    - shell: bash
      env:
        DIR: ${{ steps.resolve.outputs.dir }}
      run: |  # zizmor: ignore[github-env]
        if [ ! -f "$DIR/mago" ]; then
          echo "::error::mago is missing from $DIR after install"
          exit 1
        fi
        chmod +x "$DIR/mago"
        echo "$DIR" >> "$GITHUB_PATH"
