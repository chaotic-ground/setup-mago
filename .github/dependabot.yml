---
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # The provider constraint and its lock file, which nothing was watching.
  - package-ecosystem: terraform
    directory: /.tf
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns:
          - "*"
