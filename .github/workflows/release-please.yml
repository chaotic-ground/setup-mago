---
name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          # Dotfile config to match the dot-prefixed manifest; config-file points the action at it.
          config-file: .release-please-config.json

  # Callers pin this action by major tag (chaotic-ground/setup-mago@v1), so that tag has to follow
  # the release rather than stay on whatever commit first carried it.
  major-tag:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # move the major tag
    steps:
      # The ref is moved through the API rather than a checkout: there is nothing to build here, and
      # a checkout would have to keep its credentials on disk just to push a tag.
      - name: Move the major tag to the released commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          SHA: ${{ github.sha }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v${MAJOR}" \
              -f "sha=${SHA}" -F force=true ||
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/v${MAJOR}" -f "sha=${SHA}"
